name: yello_social_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.5.0+4

environment:
  sdk: ^3.11.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  dartz: ^0.10.1
  get_it: ^9.2.1
  dio: ^5.11.1
  connectivity_plus: ^7.3.1
  go_router: ^17.5.0
  flutter_secure_storage: ^11.0.0
  jwt_decoder: ^2.0.1
  local_auth: ^3.0.2
  google_fonts: ^8.2.1
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  uuid: ^4.6.0
  logger: ^2.8.0
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.1
  safe_device: ^1.4.1
  flutter_svg: ^2.3.0
  shared_preferences: ^2.5.5
  crypto: ^3.0.7
  image_picker: ^1.2.3
  flutter_launcher_icons: ^0.14.4
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  record: ^6.2.1
  just_audio: ^0.10.6
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  bloc_test: ^10.0.0
  flutter_native_splash: ^2.4.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Generates lib/l10n/app_localizations.dart from lib/l10n/*.arb at build
  # time (config: l10n.yaml) — see AppLocalizations usage in lib/app.dart.
  generate: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # NOTE: a directory entry is NOT recursive — it only bundles files sitting
  # directly inside it, not in subdirectories. Every actual asset here lives
  # one level down (assets/icons/, assets/image/), so each must be listed
  # explicitly; a bare `assets/` entry silently bundles nothing.
  assets:
    - assets/icons/
    - assets/image/
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# `image_path` is a separate square-padded copy of the wordmark
# (assets/icons/appIconSquare.png), not assets/icons/appLogo.png directly.
# appLogo.png is a wide 310x90 banner — feeding that straight to this
# generator stretches/crops it into a distorted square. The square file is
# the same wordmark scaled up proportionally (no stretch) and centered on a
# white canvas, made via a one-off local script (not kept in the repo). If
# appLogo.png changes, regenerate appIconSquare.png the same way (scale to
# fit, center on a white 1024x1024 canvas) before re-running
# `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/appIconSquare.png"
  remove_alpha_ios: true

# `dart run flutter_native_splash:create` (re-run after changing anything
# below) generates the actual native Android/iOS splash resources from this
# config. This is what replaces Android 12+'s own default splash screen
# behavior — without it, Android draws the *launcher* icon centered inside
# its own masked/elevated shape before the Flutter engine's first frame,
# which is the bordered-card look this config removes.
#
# Deliberately **no logo image at all** here — the user wants the native
# pre-Flutter splash to show nothing but white, so `SplashPage`'s own
# code-drawn wordmark (see `splash_page.dart`) is the only logo that ever
# appears. Two different fixes for the two native splash paths, because
# they behave differently when given no image:
# - Top-level `image` (pre-Android-12, `launch_background.xml`) is simply
#   OMITTED — confirmed safe: the generator just drops that XML layer
#   entirely, leaving only the `color` background layer. No OS-level
#   fallback risk here, this XML is 100% ours.
# - `android_12.image` can NOT be omitted the same way — Android 12+'s
#   `windowSplashScreenAnimatedIcon` API falls back to the app's *launcher*
#   icon (in its own masked/bordered shape) if no icon is set at all, which
#   is exactly the bordered-card bug this whole config exists to prevent.
#   So it's pointed at `appIconBlank.png` — a plain solid-white square —
#   giving Android an explicit icon to satisfy that requirement while it
#   stays invisible against the equally-white `icon_background_color`.
flutter_native_splash:
  color: "#ffffff"
  android_12:
    color: "#ffffff"
    image: assets/icons/appIconBlank.png
    icon_background_color: "#ffffff"
